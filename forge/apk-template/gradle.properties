# Generated WebView app build configuration.
#
# Kept deliberately small: a WebView host needs no AndroidX, Kotlin or Compose,
# so these apps build quickly and have almost nothing to resolve.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=false
android.nonTransitiveRClass=true
