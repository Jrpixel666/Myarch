# Myarch build configuration
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# --- Myarch specific -------------------------------------------------------
# PRoot needs to execve() binaries that live inside the app's private data
# directory (the Arch rootfs). Android enforces W^X on app data files for
# processes whose target SDK is >= 29, so the container would be unable to
# start any guest binary. Targeting 28 keeps the app in the
# `untrusted_app_27` SELinux domain, which still permits execute_no_trans.
#
# See docs/ANDROID_EXEC_CONSTRAINTS.md for the full explanation, the
# consequences, and the alternatives. Override on the command line with
# -Pmyarch.targetSdk=35 if you only want to build the launcher half.
myarch.targetSdk=28
myarch.compileSdk=35
myarch.minSdk=26
myarch.versionCode=1
myarch.versionName=0.1.0-alpha
