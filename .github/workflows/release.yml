name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the long-obsolete
          # `tools` package, which current command-line tools no longer offer:
          # leaving it in fails the step with "Failed to find package 'tools'".
          # Listing exactly what the build needs avoids that and is faster.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Vendor proot
        run: |
          python3 tools/vendor-proot.py
          python3 tools/vendor-proot.py --check

      - name: Tests
        run: ./gradlew test

      - name: Assemble
        run: ./gradlew assembleDebug assembleRelease

      - name: Collect the APKs
        id: collect
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          ls -la dist
          # The release build is unsigned unless a keystore is configured, so
          # name the files in a way that does not pretend otherwise.
          for f in dist/*-release-unsigned.apk; do
            [ -e "$f" ] || continue
            echo "note=The release APK is unsigned; install the debug APK or sign it yourself." >> "$GITHUB_OUTPUT"
          done

      - name: Checksums
        run: cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            app/src/main/jniLibs/VENDORED.json
          body: |
            Myarch ${{ github.event.inputs.tag || github.ref_name }}

            ${{ steps.collect.outputs.note }}

            This build bundles proot, talloc and libandroid-shmem fetched from
            Termux's package repository; `VENDORED.json` records the exact
            versions and checksums, and docs/THIRD_PARTY.md the licences and
            corresponding sources.

            Nothing here has been verified on a physical device yet — see the
            status section of the README.
          generate_release_notes: true
